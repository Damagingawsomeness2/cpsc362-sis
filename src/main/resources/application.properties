spring.application.name=student-information-system

# Embedded H2 database, kept in memory and rebuilt (and re-seeded) on every start.
# To keep data between restarts, use a file instead:
#   spring.datasource.url=jdbc:h2:file:./data/sis
#   spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# The app signs users in with its own session tokens (see identity.AuthService),
# so Spring Boot's generated default user is not needed.
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

# Load the demo data (the object diagram snapshot plus a full CS catalog) on startup.
sis.seed.enabled=true

# Pretend today is this date (yyyy-MM-dd) so demos can show the add/drop rules. Blank = real date.
sis.today=

# Sign-in sessions expire after this many hours.
sis.auth.session-hours=8
