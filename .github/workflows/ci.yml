name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      - name: Unit tests
        run: ./mvnw -B -ntp test

      - name: Integration and behavioral tests
        run: ./mvnw -B -ntp verify -DskipUnitTests

      - name: Publish test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/cucumber-report.html

      - name: Publish the application jar
        uses: actions/upload-artifact@v7
        with:
          name: sis-jar
          path: target/sis.jar
